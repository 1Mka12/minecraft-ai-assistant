
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = '0.1.0'
group = 'com.minecraftaiassistant'

base {
    archivesName = 'minecraft-ai-assistant'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.172'

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument('--nogui')
        }
    }

    mods {
        minecraft_ai_assistant {
            sourceSet sourceSets.main
        }
    }
}
